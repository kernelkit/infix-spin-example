# Hello World example daemon.  Runs in runlevels 2-5; the <pid/syslogd>
# condition delays start until syslogd is up, since the daemon logs to
# syslog.  Finit supervises it and restarts it if it crashes.  It is
# enabled by the symlink in ../enabled/ -- on a running system you can
# also use `initctl enable hello-world`.
service [2345] <pid/syslogd> /usr/sbin/hello-world -- Hello World example daemon
