# Hello World example daemon.  Runs in runlevels 2-5.  The conditions
# delay start until syslogd is up, since the daemon logs there, and until
# confd has populated sysrepo, since that is where it reads its
# configuration from.  Finit supervises it and restarts it if it crashes.
# It is enabled by the symlink in ../enabled/ -- on a running system you
# can also use `initctl enable hello-world`.
service [2345] <pid/syslogd,pid/confd> /usr/sbin/hello-world -- Hello World example daemon
