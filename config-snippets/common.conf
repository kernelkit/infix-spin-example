# Branding -- shows up in /etc/os-release, the boot tagline, the CLI,
# and the generated image file names.  Make it yours.
IX_VENDOR="Example Inc."
IX_VENDOR_HOME="https://example.com"
IX_NAME="ExampleOS"
IX_ID="example-os"
IX_TAGLINE="ExampleOS -- an Infix spin"
IX_DESC="Example spin of Infix OS, use as a starting point for your own."
IX_HOME="https://example.com"
IX_DOC="https://example.com/docs"
IX_SUPPORT="mailto:support@example.com"
BR2_TARGET_GENERIC_HOSTNAME="example-os"

# Keep the RAUC compatible string of vanilla Infix so upgrades can be
# exchanged with stock Infix images of the same architecture.  Set your
# own (e.g. "${IX_ID}-${BR2_ARCH}") to lock upgrades to your spin.
IX_COMPATIBLE="infix-${BR2_ARCH}"

# Version the OS from this repo's git tags: Infix's post-build.sh runs
# `git describe` here for the BUILD_ID in /etc/os-release.
IX_OEM_PATH="${BR2_EXTERNAL_EXAMPLE_PATH}"

# Keep downloads and compiler cache in the spin repo (survives
# `make clean` / output/ wipes).
BR2_DL_DIR="${BR2_EXTERNAL_EXAMPLE_PATH}/dl"
BR2_CCACHE_DIR="${BR2_EXTERNAL_EXAMPLE_PATH}/.ccache"

# Packages from this spin (see package/)
BR2_PACKAGE_HELLO_WORLD=y
