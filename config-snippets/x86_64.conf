# Stack our rootfs overlay on top of Infix's.  Buildroot applies the
# directories in order, so files here override same-named Infix files.
BR2_ROOTFS_OVERLAY="${BR2_EXTERNAL_INFIX_PATH}/board/common/rootfs ${BR2_EXTERNAL_INFIX_PATH}/board/x86_64/rootfs ${BR2_EXTERNAL_EXAMPLE_PATH}/board/common/rootfs"
